name: Verify trace-off iterator execution

on:
  push:
    branches: [ci/verify-iterator-327-20261126]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wasm_runtime:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install the same verified Node runtime as canonical CI
        run: bash .github/scripts/install-ci-tool.sh node
      - name: Build the exact compiler source
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          git rev-parse HEAD^{tree} >> review-evidence/source.txt
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          (cd src && ./make.bash) 2>&1 | tee review-evidence/make.log
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
      - name: Prove runtime failures escape the old build-only oracle
        run: |
          file=src/cmd/go/testdata/script/logos_traceoff_trim.txt
          runner=lib/wasm/wasm_exec_node.js
          cp "$file" review-evidence/fixed-script.txt
          cp "$runner" review-evidence/fixed-runner.js
          trap 'cp review-evidence/fixed-script.txt "$file"; cp review-evidence/fixed-runner.js "$runner"' EXIT
          node --version
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('lib/wasm/wasm_exec_node.js')
          p.write_text('throw new Error("forced iterator execution failure");\n' + p.read_text())
          PYCODE
          git show b19021a01eaf7bf23d0ada763f053ea81dfe1e5a:"$file" > "$file"
          go test -v -race -count=1 cmd/go -run '^TestScript$/logos_traceoff_trim$' 2>&1 | tee review-evidence/old-oracle-misses-runtime.log
          cp review-evidence/fixed-script.txt "$file"
          if go test -v -race -count=1 cmd/go -run '^TestScript$/logos_traceoff_trim$' > review-evidence/new-oracle-runtime-red.log 2>&1; then
            cat review-evidence/new-oracle-runtime-red.log
            exit 1
          fi
          cat review-evidence/new-oracle-runtime-red.log
          grep -F 'forced iterator execution failure' review-evidence/new-oracle-runtime-red.log
      - name: Execute both real iterator programs after restoration
        run: |
          go test -v -race -count=1 cmd/go -run '^TestScript$/logos_traceoff_trim$' 2>&1 | tee review-evidence/actual-wasm-green.log
          ! grep -E -- '--- SKIP: TestScript/logos_traceoff_trim' review-evidence/actual-wasm-green.log
          grep -F '> cmp stdout pull.stdout' review-evidence/actual-wasm-green.log
          grep -F '> cmp stdout pull2.stdout' review-evidence/actual-wasm-green.log
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: traceoff-iterator-runtime-${{ github.sha }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7
