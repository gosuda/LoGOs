name: Reproduce eject support regressions

on:
  push:
    branches: [ci/verify-eject-270-red-20261126]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build the exact merged toolchain
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          git rev-parse HEAD^{tree} >> review-evidence/source.txt
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          (cd src && ./make.bash) 2>&1 | tee review-evidence/make.log
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
          tar -czf review-evidence/toolchain.tar.gz bin pkg/tool
          sha256sum review-evidence/toolchain.tar.gz > review-evidence/toolchain.sha256
      - name: Confirm the asset-copy unit regression
        run: |
          set +e
          go test -race -count=1 -short cmd/go/internal/logos/eject -run '^TestSupportCopyOverlayAssets$' > review-evidence/overlay-unit.log 2>&1
          status=$?
          set -e
          cat review-evidence/overlay-unit.log
          test "$status" -ne 0
          grep -F 'inserted.h' review-evidence/overlay-unit.log
          grep -F 'no such file or directory' review-evidence/overlay-unit.log
      - name: Confirm the inactive-import regression
        if: ${{ !cancelled() }}
        run: |
          set +e
          go test -race -count=1 cmd/go -run 'Script/^logos_eject_inactive_go_import$' > review-evidence/inactive-import.log 2>&1
          status=$?
          set -e
          cat review-evidence/inactive-import.log
          test "$status" -ne 0
          grep -F 'ejecttestwin' review-evidence/inactive-import.log
          grep -F 'build constraints exclude all Go files' review-evidence/inactive-import.log
      - name: Confirm the overlay export regression
        if: ${{ !cancelled() }}
        run: |
          set +e
          go test -race -count=1 cmd/go -run 'Script/^logos_eject_overlay_toolchain$' > review-evidence/overlay-script.log 2>&1
          status=$?
          set -e
          cat review-evidence/overlay-script.log
          test "$status" -ne 0
          grep -F 'inserted.h' review-evidence/overlay-script.log
          grep -F 'no such file or directory' review-evidence/overlay-script.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: eject-red-${{ github.sha }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7
