name: "autovec stability"

"on":
  pull_request:
    paths:
      - ".github/workflows/autovec.yml"
      - "src/cmd/compile/internal/ssa/autovec*"
      - "src/cmd/compile/internal/ssa/testdata/autovec*"
      - "src/runtime/autovec*"
      - "test/logos/**/autovec*"

permissions:
  contents: "read"

concurrency:
  group: "autovec-stability-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  native:
    name: "autovec native ${{ matrix.arch }}"
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-26.04"
          - arch: "arm64"
            runner: "ubuntu-26.04-arm"
    defaults:
      run:
        shell: "bash"
        working-directory: "src"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha }}"
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: "Record native environment"
        run: |
          mkdir -p "$RUNNER_TEMP/autovec-evidence"
          printf 'UPROOT1274=%s\n' "$(go env GOROOT)" >> "$GITHUB_ENV"
          go version | tee "$RUNNER_TEMP/autovec-evidence/toolchain.txt"
          lscpu | tee "$RUNNER_TEMP/autovec-evidence/cpu.txt"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: "Build the toolchain"
        run: |
          GOROOT_BOOTSTRAP="$UPROOT1274" ./make.bash
          printf '%s\n' "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: "Compare recovered mapped-memory faults"
        run: |
          probe=cmd/compile/internal/ssa/testdata/autovec_fault_probe.go
          {
            printf 'upstream optimized\n'
            GOEXPERIMENT=none GOAMD64=v3 "$UPROOT1274/bin/go" run "$probe"
            printf 'upstream unoptimized\n'
            GOEXPERIMENT=none GOAMD64=v3 "$UPROOT1274/bin/go" run -gcflags=-N "$probe"
            printf 'fork SIMD enabled\n'
            GOEXPERIMENT=simd GOAMD64=v3 go run "$probe"
            printf 'fork pass disabled\n'
            GOEXPERIMENT=simd GOAMD64=v3 go run -gcflags=-d=ssa/autovec/off "$probe"
          } | tee "$RUNNER_TEMP/autovec-evidence/fault-order.txt"
      - name: "Check new fixture formatting"
        run: |
          files=(../test/logos/run/autovec_memory.go ../test/logos/run/autovec_gc.go cmd/compile/internal/ssa/testdata/autovec_fault_probe.go)
          gofmt -d "${files[@]}" | tee "$RUNNER_TEMP/autovec-evidence/gofmt.diff"
          test ! -s "$RUNNER_TEMP/autovec-evidence/gofmt.diff"
      - name: "Check compiler invariants and native fixtures"
        run: |
          go test -count=1 -short cmd/compile/internal/ssa
          go vet cmd/compile/internal/ssa
          GOEXPERIMENT=simd GOAMD64=v3 go test -count=1 -timeout 20m cmd/internal/testdir -run '^Test$/^logos$/^(codegen|run)$/^autovec' -all_codegen
      - name: "Check guarded memory under compiler modes"
        run: |
          fixture=../test/logos/run/autovec_memory.go
          GOEXPERIMENT=simd GOAMD64=v3 go build -gcflags=-d=ssa/autovec/debug=1 -o "$RUNNER_TEMP/memory" "$fixture" 2>&1 | tee "$RUNNER_TEMP/autovec-evidence/memory-vectorization.txt"
          for bits in 8 16 32 64; do
            grep -E "autovec_memory.go:25:.*autovectorized $bits-bit integer loop" "$RUNNER_TEMP/autovec-evidence/memory-vectorization.txt"
          done
          "$RUNNER_TEMP/memory"
          GOEXPERIMENT=simd GOAMD64=v3 go run -gcflags=-d=ssa/autovec/off "$fixture"
          GOEXPERIMENT=none go run "$fixture"
          GOEXPERIMENT=simd GOAMD64=v3 go run -race "$fixture"
      - name: "Check synchronous GC in the vector loop"
        run: |
          GOEXPERIMENT=simd,preemptibleloops GOAMD64=v3 go build -gcflags=-d=ssa/autovec/debug=1 -o "$RUNNER_TEMP/vector-gc" ../test/logos/run/autovec_gc.go 2>&1 | tee "$RUNNER_TEMP/autovec-evidence/gc-vectorization.txt"
          grep -E 'autovec_gc.go:48:.*autovectorized 64-bit integer loop' "$RUNNER_TEMP/autovec-evidence/gc-vectorization.txt"
          GODEBUG=asyncpreemptoff=1 timeout 90s "$RUNNER_TEMP/vector-gc"
      - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        if: "always()"
        with:
          name: "autovec-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/autovec-evidence"

  regression:
    name: "upstream regression with SIMD"
    runs-on: "ubuntu-26.04"
    timeout-minutes: 120
    defaults:
      run:
        shell: "bash"
        working-directory: "src"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha }}"
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "26.13.1"
      - name: "Install the upstream oracle toolchains"
        run: |
          printf 'UPROOT1274=%s\n' "$(go env GOROOT)" >> "$GITHUB_ENV"
          while read -r version sha256 root; do
            archive="$RUNNER_TEMP/go$version.linux-amd64.tar.gz"
            curl --fail --silent --show-error --location --output "$archive" "https://go.dev/dl/go$version.linux-amd64.tar.gz"
            printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict -
            mkdir "$RUNNER_TEMP/go$version"
            tar -xzf "$archive" -C "$RUNNER_TEMP/go$version" --strip-components=1
            printf '%s=%s\n' "$root" "$RUNNER_TEMP/go$version" >> "$GITHUB_ENV"
          done <<'PINS'
          1.27.2 ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5 UPROOT1272
          1.27.3 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40 UPROOT1273
          PINS
      - name: "Build the toolchain"
        run: |
          GOROOT_BOOTSTRAP="$UPROOT1274" ./make.bash
          printf '%s\n' "$GITHUB_WORKSPACE/lib/wasm" "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: "Run the complete upstream regression gate"
        run: |
          GOEXPERIMENT=simd GOAMD64=v3 ./run.bash --no-rebuild
