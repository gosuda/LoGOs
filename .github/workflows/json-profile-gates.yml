name: "JSON profile compatibility"

"on":
  pull_request:
    paths:
      - ".github/scripts/install-upstream-oracles.sh"
      - ".github/workflows/json-profile-gates.yml"
      - "src/cmd/compile/internal/logos/**"
      - "src/logos/rt/json/**"
      - "src/cmd/go/testdata/script/logos_*json*.txt"
      - "test/logos/run/json*.lgo"
      - "test/logos/run/comptime_json*.lgo"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "json-profiles-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  profiles:
    runs-on: "ubuntu-26.04"
    timeout-minutes: 90
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOMEMLIMIT: "2GiB"
    defaults:
      run:
        shell: "bash"
        working-directory: "src"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: "Install upstream ejection toolchains"
        run: bash ../.github/scripts/install-upstream-oracles.sh
      - name: "Build the toolchain"
        id: build
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          GOEXPERIMENT= ./make.bash
          printf '%s\n' "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: "Check formatting"
        run: |
          test -z "$(gofmt -l logos/rt/json cmd/compile/internal/logos)"
      - name: "Check JSONv2"
        env:
          GOEXPERIMENT: "jsonv2"
        run: |
          go vet logos/rt/json cmd/compile/internal/logos
          go test -count=1 -race -timeout=20m logos/rt/json cmd/compile/internal/logos
          go test -count=1 -timeout=30m cmd/internal/testdir -run 'Test/logos/run/(json|comptime_json)'
          go test -count=1 -race -timeout=20m cmd/go -run 'Script/^logos_(eject_json_(embedded|cycle)|json_fallback_string)$'
      - name: "Check classic JSON"
        if: "always() && steps.build.outcome == 'success'"
        env:
          GOEXPERIMENT: "nojsonv2"
        run: |
          go vet logos/rt/json cmd/compile/internal/logos
          go test -count=1 -race -timeout=20m logos/rt/json cmd/compile/internal/logos
          go test -count=1 -timeout=30m cmd/internal/testdir -run 'Test/logos/run/(json|comptime_json)'
          go test -count=1 -race -timeout=20m cmd/go -run 'Script/^logos_(eject_json_(embedded|cycle)|json_fallback_string)$'
