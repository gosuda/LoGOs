name: Reproduce invocation review findings

on:
  push:
    branches: [ci/verify-flow-337-red-20261126]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  witnesses:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 25
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build unchanged replacement-PR compiler
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          git rev-parse HEAD^{tree} >> review-evidence/source.txt
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          (cd src && ./make.bash) 2>&1 | tee review-evidence/make.log
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
      - name: Preserve existing flow controls
        run: go test -v -count=1 cmd/compile/internal/types2 -run '^TestLogos$/error_first_(flow|inline)\.lgo$' 2>&1 | tee review-evidence/controls.log
      - name: Reproduce remaining cleanup and invocation findings
        run: |
          for fixture in error_first_review263 error_first_cleanup_paths error_first_calls337; do
            if go test -v -count=1 cmd/compile/internal/types2 -run "^TestLogos\$/$fixture\\.lgo\$" > "review-evidence/$fixture.log" 2>&1; then
              cat "review-evidence/$fixture.log"
              echo "expected witness failure did not occur: $fixture"
              exit 1
            fi
            cat "review-evidence/$fixture.log"
            grep -E 'unreported errors|no error expected' "review-evidence/$fixture.log"
            grep -F "$fixture.lgo:" "review-evidence/$fixture.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: invocation-red-${{ github.sha }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7
