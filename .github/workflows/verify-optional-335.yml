name: Verify optional cleanup edge cases

on:
  push:
    branches: [ci/verify-optional-335-edges-red-20261126]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  review_cases:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.2'
          cache: false
      - run: printf 'UPROOT1272=%s\n' "$(go env GOROOT)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Freeze the unchanged compiler and build it
        run: |
          export GOENV=off GOCACHEPROG=''
          git diff --exit-code 7974cee72b4d6a908b590bff01c41a38ba5f877f HEAD -- src/cmd/compile
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          go env GOENV GOCACHEPROG | tee review-evidence/cache-env.txt
          test -z "$(go env GOCACHEPROG)"
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          (cd src && ./make.bash) 2>&1 | tee review-evidence/make.log
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
      - name: Verify the positive binding and instantiated-statement controls
        run: |
          export GOENV=off GOCACHEPROG=''
          go test -v -count=1 cmd/internal/testdir -run '^Test$/logos/run/(option_defer_binding_review335|comptime_option_resultless_review335)\.lgo$' 2>&1 | tee review-evidence/controls.log
      - name: Reproduce the multi-result capture failure before changing the compiler
        run: |
          export GOENV=off GOCACHEPROG=''
          if go test -v -count=1 cmd/internal/testdir -run '^Test$/logos/run/option_defer_multi_review335\.lgo$' > review-evidence/multi-red.log 2>&1; then
            cat review-evidence/multi-red.log
            exit 1
          fi
          cat review-evidence/multi-red.log
          grep -E 'multiple-value|assignment mismatch' review-evidence/multi-red.log
          if go test -v -race -count=1 cmd/go -run '^TestScript$/logos_option_defer_edges_review335$' > review-evidence/export-red.log 2>&1; then
            cat review-evidence/export-red.log
            exit 1
          fi
          cat review-evidence/export-red.log
          grep -E 'multiple-value|assignment mismatch' review-evidence/export-red.log
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: optional-review-edges-red-${{ github.sha }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7
