name: Verify deferred-flow review attacks

on:
  push:
    branches: [ci/verify-flow-263-red-20261126]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regressions:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build the exact merged baseline
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          git rev-parse HEAD^{tree} >> review-evidence/source.txt
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          (cd src && ./make.bash) 2>&1 | tee review-evidence/make.log
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
      - name: Existing flow fixtures
        run: go test -v -count=1 cmd/compile/internal/types2 -run '^TestLogos$/(error_first_inline|error_first_flow)\.lgo$' 2>&1 | tee review-evidence/baseline.log
      - name: Verify flow attacks fail for semantic reasons
        run: |
          if go test -v -count=1 cmd/compile/internal/types2 -run '^TestLogos$/error_first_review263\.lgo$' > review-evidence/flow-red.log 2>&1; then
            cat review-evidence/flow-red.log
            echo 'flow attacks unexpectedly passed'
            exit 1
          fi
          cat review-evidence/flow-red.log
          grep -E 'no error expected|unreported errors|unmatched error|unexpected error' review-evidence/flow-red.log
      - name: Current base preserves direct public pointer aliases
        if: ${{ !cancelled() }}
        run: go test -v -count=1 cmd/go -run '^TestScript$/logos_json_union_alias_pointer$' 2>&1 | tee review-evidence/alias-control.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: flow-red-${{ github.sha }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 7
