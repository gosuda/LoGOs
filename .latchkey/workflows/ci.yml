name: CI

on:
  push:
    branches: [release-branch.go1.27]
  pull_request:
  workflow_dispatch:

latchkey:
  schema: 1

jobs:
  probe:
    runs-on: small
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          pwd; whoami; nproc; free -g | head -2; df -h . | tail -1
          env | grep -E '^(LATCHKEY|RUNNER|GITHUB|CI|HOME|PATH)' | grep -v -i token | sort
          for c in gcc-14 gccgo clang jq uv hyperfine node qemu-x86_64 shellcheck python3 sudo go perl; do printf '%s: ' "$c"; command -v "$c" || echo MISSING; done
          go version; node --version
          git rev-parse HEAD; git rev-parse --is-shallow-repository; git remote -v | head -1
          git fetch --no-tags --depth=1 origin "${LATCHKEY_CI_BASE_REF:-refs/heads/release-branch.go1.27}" && git rev-parse FETCH_HEAD
          git diff --name-only FETCH_HEAD HEAD | head -5
          mkdir -p ~/tc && echo hi > ~/tc/a.txt
      - uses: latchkey/artifact-upload@1.0.0
        with:
          name: probe
          from: ~
          path: tc
  consume:
    needs: probe
    runs-on: small
    timeout-minutes: 10
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: probe
          into: ~
      - run: cat ~/tc/a.txt; pwd
