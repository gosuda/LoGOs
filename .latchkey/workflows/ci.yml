name: CI

# Latchkey replacement for the former .github/workflows (see .latchkey/*.sh). One run per commit:
# route picks suites from the changed paths, build compiles the toolchain once, the suites reuse it.
on:
  push:
    branches: [release-branch.go1.27]
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "core ssa gc gates compiler cgo dogfood, or all"
        default: all

latchkey:
  schema: 1

jobs:
  route:
    runs-on: small
    timeout-minutes: 10
    outputs:
      - core
      - ssa
      - gc
      - gates
      - gate_any
      - regression
      - compiler
      - cgo
      - dogfood
      - bench
      - build
    steps:
      - run: for f in .latchkey/*.sh; do bash -n "$f"; done
      - run: bash .latchkey/route.sh

  build:
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: medium
    timeout-minutes: 30
    steps:
      - run: bash .latchkey/setup.sh build
      - uses: latchkey/artifact-upload@1.0.0
        with:
          name: toolchain
          from: ~
          path: tc

  # logos.yml suites unit / scripts / upstream / autovec (and tagged-facts, which unit already runs)
  unit:
    needs: [route, build]
    if: needs.route.outputs.core == 'true'
    runs-on: medium
    timeout-minutes: 150
    env:
      LOGOS_PACKAGES: >-
        logos/... cmd/go/internal/logos/... cmd/compile/internal/logos/... cmd/internal/logos/...
        cmd/internal/logosowned internal/logosfile cmd/cgo/internal/testlogos
      GOLANGCI_LINT_VERSION: "2.15.0"
      GOLANGCI_LINT_SHA256: "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea"
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore py
      - name: Unit tests
        run: bash .latchkey/unit-tests.sh
      - name: Compiler fixtures
        if: always()
        run: bash .latchkey/unit-fixtures.sh
      - name: Lint (gofmt, vet, golangci-lint)
        if: always()
        run: bash .latchkey/unit-lint.sh
      - name: Evidence checkers and controls (wasm, tagged facts/methods, field offsets, simd imports, zero arrays)
        if: always()
        run: bash .latchkey/unit-evidence.sh
  scripts:
    needs: [route, build]
    if: needs.route.outputs.regression == 'true'
    runs-on: large
    timeout-minutes: 180
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles c23
      - name: Full upstream and LoGOs regression (run.bash; includes every cmd/go script test)
        run: bash .latchkey/scripts-regression.sh
      - name: Installed test subprocess behavior and inline capability ownership
        if: always()
        run: bash .latchkey/scripts-subprocess.sh
  upstream:
    needs: [route, build]
    if: needs.route.outputs.core == 'true'
    runs-on: large
    timeout-minutes: 150
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles py c23
      - name: Complete upstream complement under the compact test environment
        run: bash .latchkey/upstream-complement.sh
  autovec:
    needs: [route, build]
    if: needs.route.outputs.core == 'true'
    runs-on: medium
    timeout-minutes: 60
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles c23
      - name: Automatic vectorization tests
        run: bash .latchkey/autovec-tests.sh
  compiler:
    needs: [route, build]
    if: needs.route.outputs.compiler == 'true'
    runs-on: medium
    timeout-minutes: 120
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOMEMLIMIT: 2GiB
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles c23
      - name: Focused compiler and command checks
        run: bash .latchkey/compiler-checks.sh
  gates:
    needs: [route, build]
    if: needs.route.outputs.gate_any == 'true'
    runs-on: medium
    timeout-minutes: 150
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOMEMLIMIT: 2GiB
      GATES: ${{ needs.route.outputs.gates }}
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: Routed feature gates (feature-gate.sh, minus its own toolchain build)
        run: bash .latchkey/gates-routed.sh
  gc:
    needs: [route, build]
    if: needs.route.outputs.gc == 'true'
    runs-on: medium
    timeout-minutes: 120
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOMEMLIMIT: 2GiB
    strategy:
      fail-fast: false
      matrix:
        experiment: [logosarena, "logosarena,nogreenteagc"]
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore 
      - name: Runtime GC stability under each experiment
        env:
          EXP: ${{ matrix.experiment }}
        run: bash .latchkey/gc-experiments.sh
      - name: Original close-ownership failure probe
        if: matrix.experiment == 'logosarena'
        env:
          EXP: ${{ matrix.experiment }}
        run: bash .latchkey/gc-probe.sh
  ssa:
    needs: [route, build]
    if: needs.route.outputs.ssa == 'true'
    runs-on: medium
    timeout-minutes: 150
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOMEMLIMIT: 2GiB
      GOAMD64: v1
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: "SIMD zero guards: frozen attacks, vet, mutation proof"
        run: bash .latchkey/ssa-zero1.sh
      - name: "SIMD zero guards: native and emulated (qemu) CPUs"
        if: always()
        run: bash .latchkey/ssa-zero2.sh
      - name: "SIMD gate and dominance scripts (plain and race), wasm runner isolation"
        if: always()
        run: bash .latchkey/ssa-zero3.sh
      - name: "Autovec native: preflight, faults, memory, GC"
        if: always()
        run: bash .latchkey/ssa-av1.sh
      - name: "Autovec native: mutation proofs and ejection"
        if: always()
        run: bash .latchkey/ssa-av2.sh
      - name: "Autovec native: formatting and generated builtins enforced"
        if: always()
        run: bash .latchkey/ssa-av3.sh

  # Stopped by Latchkey after ~15 min in every run so far (cause not found), so manual runs only.
  simdstd:
    needs: [route, build]
    if: env.LATCHKEY_CI_EVENT_CLASS == 'workflow_dispatch' && needs.route.outputs.ssa == 'true'
    runs-on: medium
    timeout-minutes: 150
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: SIMD standard library at the baseline (v1) and v3 targets
        run: bash .latchkey/simdstd-library.sh
  cgo:
    needs: [route, build]
    if: needs.route.outputs.cgo == 'true'
    runs-on: medium
    timeout-minutes: 120
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: C compilers (gccgo)
        run: bash .latchkey/cgo-compilers.sh
      - name: "cgo focused: lint, compat, probes, families, sanitizers, stock oracle"
        if: always()
        run: bash .latchkey/cgo-focused.sh
  cgofull:
    needs: [route, build, cgo]
    if: env.LATCHKEY_CI_EVENT_CLASS == 'branch_push' && needs.route.outputs.cgo == 'true'
    runs-on: medium
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        experiment: ["nologoscgoopt,nologosfastcgo", "logoscgoopt,nologosfastcgo"]
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: C compilers (gccgo)
        run: bash .latchkey/cgo-compilers.sh
      - name: cgo full default-short dist under each cgo experiment
        env:
          CGO_EXPERIMENT: ${{ matrix.experiment }}
        run: bash .latchkey/cgofull-dist.sh
  cgobench:
    needs: [route, build, cgo]
    if: env.LATCHKEY_CI_EVENT_CLASS == 'branch_push' && needs.route.outputs.cgo == 'true'
    runs-on: medium
    timeout-minutes: 120
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore oracles
      - name: C compilers (gccgo)
        run: bash .latchkey/cgo-compilers.sh
      - name: "cgo benchmark: one frozen sequential campaign per declared row"
        run: bash .latchkey/cgobench-benchmark.sh
  dogfood:
    needs: [route, build]
    if: needs.route.outputs.dogfood == 'true'
    runs-on: medium
    timeout-minutes: 120
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 2GiB
      GOGC: "50"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOENV: "off"
      GOTELEMETRY: "off"
      CC: gcc
      CXX: g++
      GGLINT_REVISION: 4456e61c4dbdf636fca2b5bd77787873e2d1c1e8
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore nopath
      - name: "Corpus: contracts, exact sources"
        run: bash .latchkey/dogfood-contracts.sh
      - name: "Corpus: build reviewed gglint"
        if: always()
        run: bash .latchkey/dogfood-gglint.sh
      - name: "Corpus: tools diagnostics"
        if: always()
        run: bash .latchkey/dogfood-tools.sh
      - name: "Retain early tools diagnostics"
        if: always()
        run: bash .latchkey/dogfood-retainearly.sh
      - uses: latchkey/artifact-upload@1.0.0
        if: always()
        with:
          name: dogfood-tools-probe
          from: .
          path: dogfood-early
      - name: "Corpus: replay and assess all 196 cells"
        if: always()
        run: bash .latchkey/dogfood-replay.sh
      - name: "Corpus: fixtures, backends, FFI, language, lint"
        if: always()
        run: bash .latchkey/dogfood-corpus.sh
      - name: "Retain source receipts, reports, and raw evidence"
        if: always()
        run: bash .latchkey/dogfood-retainevidence.sh
      - uses: latchkey/artifact-upload@1.0.0
        if: always()
        with:
          name: dogfood-evidence
          from: .
          path: dogfood-evidence

  bench:
    needs: [route, build]
    if: env.LATCHKEY_CI_EVENT_CLASS == 'pr_update' && needs.route.outputs.bench == 'true'
    runs-on: medium
    timeout-minutes: 90
    steps:
      - uses: latchkey/artifact-download@1.0.0
        with:
          name: toolchain
          into: ~
      - run: bash .latchkey/setup.sh restore 
      - name: "Autovec benchmarks: base vs candidate, measured sequentially"
        run: bash .latchkey/bench-autovec.sh
